<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project | Alaa Hassanin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--cream:#f4efe6;--paper:#fffcf7;--ink:#242321;--muted:#777167;--line:#dcd4c8;--brick:#a9543c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.8 'DM Sans',sans-serif}body.ar{font-family:'Tajawal',sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:1120px;width:calc(100% - 52px);margin:auto}header{border-bottom:1px solid var(--line)}nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:20px;font-weight:700}.brand b,.accent{color:var(--brick)}.right{display:flex;align-items:center;gap:22px;font-size:13px}.lang{background:none;padding:10px 15px;border:1px solid var(--ink);cursor:pointer;font:inherit}.eyebrow{color:var(--brick);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero{padding:75px 0 48px}.hero h1,h2{font:normal clamp(47px,6vw,82px)/1.08 'DM Serif Display',serif;letter-spacing:-.035em;margin:18px 0 20px}.ar h1,.ar h2{font-family:'Tajawal';letter-spacing:0}p{max-width:770px;color:#555047}.lede{font-size:20px;line-height:1.8}.image{max-height:600px;overflow:hidden;background:var(--paper);border:12px solid var(--paper)}.image img{width:100%;max-height:575px;object-fit:contain;display:block}.section{border-top:1px solid var(--line);padding:56px 0}.details{display:grid;grid-template-columns:1fr 1fr;gap:65px}.details h2{font-size:45px}.metric{font-size:22px;line-height:1.6;color:var(--ink)}.btn{background:var(--ink);color:white;display:inline-block;padding:13px 20px;margin:8px 12px 8px 0;font-size:14px}.btn:hover{background:var(--brick)}.small{font-size:13px;color:var(--muted)}.links{margin:15px 0}.bottom{display:flex;justify-content:space-between;gap:15px;padding:45px 0}footer{border-top:1px solid var(--line);font-size:12px;color:var(--muted);padding:24px 0}@media(max-width:700px){.details{grid-template-columns:1fr;gap:15px}.hero{padding:45px 0 30px}.shell{width:calc(100% - 36px)}.right{gap:9px}.bottom{flex-direction:column}}

.evidence-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px;margin:24px 0 40px}.evidence-gallery[hidden]{display:none}.evidence-gallery img{width:100%;height:auto;display:block;border:1px solid #dcd4c8;background:#fff;border-radius:4px}.image img{object-fit:contain!important;background:#f4efe6}
</style></head><body><header><nav class="shell"><a class="brand" href="index.html">Alaa Hassanin<b>.</b></a><div class="right"><a id="allTop" href="index.html#work">All projects ↗</a><button class="lang" id="lang">عربي / EN</button></div></nav></header><main class="shell" id="main"><section class="hero"><div class="eyebrow" id="category"></div><h1 id="name"></h1><p class="lede" id="description"></p></section><div class="image" id="imageWrap"><img id="image" alt="Project sample" /></div><div id="evidenceGallery" class="evidence-gallery" hidden></div><section class="section details"><div><div class="eyebrow" id="roleLabel"></div><h2 id="workHeading"></h2><p id="role"></p></div><div><div class="eyebrow" id="resultsLabel"></div><h2 id="evidenceHeading"></h2><p class="metric" id="results"></p></div></section><section class="section" id="more" hidden><div class="eyebrow" id="linksLabel"></div><h2 id="linksHeading"></h2><div id="links" class="links"></div></section><div class="bottom"><a class="btn" id="back" href="index.html#work"></a><a id="next"></a></div></main><footer><div class="shell">© Alaa Hassanin · <span id="year"></span></div></footer><script src="projects-data.js"></script><script>
const items=window.PORTFOLIO_PROJECTS||[];const id=new URLSearchParams(location.search).get('id');const p=items.find(x=>x.id===id);const $=x=>document.getElementById(x);let lang='en';try{lang=localStorage.getItem('alaa-lang')==='ar'?'ar':'en'}catch(e){}
const tr=(a,b)=>lang==='ar'?b:a;const txt=(key,val)=>$(key).textContent=val;
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('ar',lang==='ar');if(!p){txt('name',tr('Project not found','المشروع غير موجود'));txt('description',tr('Return to the work page to find an available project.','ارجعي لصفحة المشاريع لاختيار مشروع متاح.'));$('image').hidden=true;return}
document.title=tr(p.en,p.ar)+' | Alaa Hassanin';txt('category',tr(p.cat,p.catAr));txt('name',tr(p.en,p.ar));txt('description',tr(p.descriptionEn||p.roleEn,p.descriptionAr||p.roleAr));if(p.img){$('imageWrap').hidden=false;$('image').src=p.img;$('image').alt=tr('Project visual samples: '+p.en,'نماذج المشروع: '+p.ar);}else{$('imageWrap').hidden=true;$('image').removeAttribute('src');}$('image').alt=tr('Project visual samples: '+p.en,'نماذج المشروع: '+p.ar);const gallery=p.gallery||[];const gal=$('evidenceGallery');gal.replaceChildren();gal.hidden=gallery.length<2;gallery.slice(1).forEach((src,i)=>{const im=document.createElement('img');im.src=src;im.loading='lazy';im.alt=tr('Campaign evidence screenshot '+(i+2),'لقطة نتائج الحملة '+(i+2));gal.appendChild(im)});txt('roleLabel',tr('MY ROLE','دوري في المشروع'));txt('workHeading',tr('What I worked on','اشتغلت على إيه؟'));txt('role',tr(p.roleEn,p.roleAr));txt('resultsLabel',tr('SCOPE & REPORTED RESULTS','نطاق العمل والنتائج'));txt('evidenceHeading',tr('The work & evidence','الشغل والنتائج'));txt('results',tr(p.resultsEn,p.resultsAr));txt('linksLabel',tr('PROJECT MATERIALS','ملفات وروابط المشروع'));txt('linksHeading',tr('Explore the work','شوفي الشغل كامل'));$('links').replaceChildren();const links=p.links||[];$('more').hidden=!links.length;links.forEach(x=>{const a=document.createElement('a');a.className='btn';a.textContent=tr(x.en,x.ar)+' ↗';a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';$('links').appendChild(a)});txt('back',tr('← All projects','← كل المشاريع'));txt('allTop',tr('All projects ↗','كل المشاريع ↗'));const next=items[(items.indexOf(p)+1)%items.length];$('next').href='project.html?id='+encodeURIComponent(next.id);txt('next',tr('Next: '+next.en+' →','التالي: '+next.ar+' ←'));}
$('year').textContent=new Date().getFullYear();$('lang').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('alaa-lang',lang)}catch(e){}render()});render();
</script></body></html>
